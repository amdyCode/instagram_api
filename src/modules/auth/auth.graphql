type User {
  id: ID!
  email: String!
  username: String!
  fullName: String
  bio: String
  avatarUrl: String
  postCount: Int!
  followerCount: Int!
  followingCount: Int!
  createdAt: String!
}

type AuthPayload {
  token: String!
  user: User!
}

input RegisterInput {
  email: String!
  username: String!
  password: String!
  fullName: String
  avatarUrl: String
}

input LoginInput {
  emailOrUsername: String!
  password: String!
}

type Query {
  me: User
}

type Mutation {
  register(input: RegisterInput!): AuthPayload!
  login(input: LoginInput!): AuthPayload!
}
